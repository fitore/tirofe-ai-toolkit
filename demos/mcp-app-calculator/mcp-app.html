<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reverse Mortgage Eligibility Demo</title>
  </head>
  <body>
    <main id="app" class="shell">
      <section class="panel" aria-labelledby="app-title">
        <header>
          <p class="kicker">Personal demo</p>
          <h1 id="app-title">Reverse mortgage eligibility</h1>
        </header>

        <form id="eligibility-form" class="form">
          <label>
            <span>Age</span>
            <input id="age" name="age" type="number" min="0" step="1" value="65" required />
          </label>

          <label>
            <span>Home value (CAD)</span>
            <input
              id="homeValue"
              name="homeValue"
              type="number"
              min="0"
              step="1000"
              value="750000"
              required
            />
          </label>

          <label>
            <span>Province</span>
            <select id="province" name="province" required>
              <option value="ON">Ontario</option>
              <option value="BC">British Columbia</option>
              <option value="AB">Alberta</option>
              <option value="QC">Quebec</option>
              <option value="OTHER">Other</option>
            </select>
          </label>

          <button id="submit" type="submit">Check eligibility</button>
        </form>

        <section id="result" class="result" aria-live="polite"></section>
      </section>
    </main>
    <script type="module" src="/src/ui/mcp-app.ts"></script>
  </body>
</html>
